<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="title desc">
  <title id="title">Daniel Totov: Java Backend Developer</title>
  <desc id="desc">Red theatre curtains open on a spotlit stage showing the name Daniel Totov, the title Java Backend Developer, and the code line stage.exit(); stack.enter();</desc>

  <!-- Only the animation lives in CSS. Every element's resting state is the
       finished, open stage, so the banner still looks right anywhere CSS
       animation is unavailable, and for visitors who prefer reduced motion. -->
  <style>
    @keyframes openL { from { transform: translateX(600px); }  to { transform: translateX(0); } }
    @keyframes openR { from { transform: translateX(-600px); } to { transform: translateX(0); } }
    @keyframes rise  { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes glow  { from { opacity: 0; } to { opacity: 1; } }
    @keyframes blink { 0%, 49% { fill-opacity: 1; } 50%, 100% { fill-opacity: 0; } }

    .curtainL { animation: openL 1.8s cubic-bezier(.7,0,.3,1) .5s both; }
    .curtainR { animation: openR 1.8s cubic-bezier(.7,0,.3,1) .5s both; }
    .spot     { animation: glow 1.2s ease-out 1.1s both; }
    .r1       { animation: rise .8s ease-out 1.6s both; }
    .r2       { animation: rise .8s ease-out 1.9s both; }
    .r3       { animation: rise .8s ease-out 2.2s both; }
    .cursor   { animation: blink 1.1s linear 3s infinite; }

    @media (prefers-reduced-motion: reduce) {
      .curtainL, .curtainR, .spot, .r1, .r2, .r3, .cursor { animation: none; }
    }
  </style>

  <defs>
    <clipPath id="frame"><rect width="1200" height="300" rx="18"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18110f"/>
      <stop offset="1" stop-color="#0b0807"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="600" cy="125" r="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe9b0" stop-opacity=".30"/>
      <stop offset=".5" stop-color="#ffcf70" stop-opacity=".08"/>
      <stop offset="1" stop-color="#ffcf70" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3d1" stop-opacity=".16"/>
      <stop offset="1" stop-color="#fff3d1" stop-opacity="0"/>
    </linearGradient>
    <!-- velvet folds: a red light/dark band that repeats every 46px -->
    <linearGradient id="folds" x1="0" y1="0" x2="46" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat">
      <stop offset="0" stop-color="#3f0510"/>
      <stop offset=".35" stop-color="#8e1124"/>
      <stop offset=".55" stop-color="#c51f37"/>
      <stop offset=".75" stop-color="#8e1124"/>
      <stop offset="1" stop-color="#3f0510"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".45"/>
      <stop offset=".25" stop-color="#000" stop-opacity="0"/>
      <stop offset=".8" stop-color="#000" stop-opacity=".15"/>
      <stop offset="1" stop-color="#000" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a2e1b"/>
      <stop offset="1" stop-color="#170d07"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a6420"/>
      <stop offset=".5" stop-color="#e9c46a"/>
      <stop offset="1" stop-color="#8a6420"/>
    </linearGradient>
    <!-- one tied-back drape; the right one is the same shape mirrored -->
    <path id="drape" d="M0 0 H255 C215 70 150 140 92 196 C108 228 124 262 136 300 H0 Z"/>
    <path id="tieback" d="M0 186 C30 184 66 190 96 198"/>
  </defs>

  <g clip-path="url(#frame)">
    <!-- backdrop, spotlight and stage floor -->
    <rect width="1200" height="300" fill="url(#bg)"/>
    <g class="spot">
      <polygon points="540,0 660,0 880,262 320,262" fill="url(#beam)"/>
      <rect width="1200" height="300" fill="url(#spotlight)"/>
    </g>
    <rect y="262" width="1200" height="38" fill="url(#floor)"/>
    <rect y="262" width="1200" height="2" fill="#7a5233" fill-opacity=".8"/>
    <ellipse class="spot" cx="600" cy="264" rx="320" ry="12" fill="#ffd27a" fill-opacity=".16"/>

    <!-- the act -->
    <text class="r1" x="600" y="126" text-anchor="middle"
          font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="60" font-weight="800"
          letter-spacing="6" fill="#fbf3e4">DANIEL TOTOV</text>
    <text class="r2" x="600" y="167" text-anchor="middle"
          font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600"
          letter-spacing="1.5" fill="#e9c46a">JAVA BACKEND DEVELOPER  ·  FROM THE STAGE TO THE STACK</text>
    <text class="r3" x="600" y="222" text-anchor="middle" xml:space="preserve"
          font-family="'Cascadia Code', 'JetBrains Mono', Consolas, Menlo, 'Courier New', monospace" font-size="18"><tspan fill="#61afef">stage</tspan><tspan fill="#c8ccd4">.exit();  </tspan><tspan fill="#61afef">stack</tspan><tspan fill="#c8ccd4">.enter();  </tspan><tspan fill="#8b929e">// 8 yrs theatre → 5 yrs e-commerce data → Java</tspan><tspan class="cursor" fill="#e9c46a">▍</tspan></text>

    <!-- tied-back side drapes (always there) -->
    <g>
      <use xlink:href="#drape" fill="url(#folds)"/>
      <use xlink:href="#drape" fill="url(#shade)"/>
      <use xlink:href="#tieback" stroke="url(#gold)" stroke-width="5" stroke-linecap="round" fill="none"/>
    </g>
    <g transform="translate(1200 0) scale(-1 1)">
      <use xlink:href="#drape" fill="url(#folds)"/>
      <use xlink:href="#drape" fill="url(#shade)"/>
      <use xlink:href="#tieback" stroke="url(#gold)" stroke-width="5" stroke-linecap="round" fill="none"/>
    </g>

    <!-- main curtains: they start closed and slide off-stage when the page loads.
         Their resting position is off-stage (x < 0 and x > 1200), i.e. already open. -->
    <g class="curtainL">
      <rect x="-600" width="600" height="300" fill="url(#folds)"/>
      <rect x="-600" width="600" height="300" fill="url(#shade)"/>
      <rect x="-6" width="6" height="300" fill="#000" fill-opacity=".35"/>
    </g>
    <g class="curtainR">
      <rect x="1200" width="600" height="300" fill="url(#folds)"/>
      <rect x="1200" width="600" height="300" fill="url(#shade)"/>
      <rect x="1200" width="6" height="300" fill="#000" fill-opacity=".35"/>
    </g>

    <!-- valance: scalloped top border with a gold trim -->
    <path d="M0 0 H1200 V24 q -30 18 -60 0 q -30 18 -60 0 q -30 18 -60 0 q -30 18 -60 0 q -30 18 -60 0 q -30 18 -60 0 q -30 18 -60 0 q -30 18 -60 0 q -30 18 -60 0 q -30 18 -60 0 q -30 18 -60 0 q -30 18 -60 0 q -30 18 -60 0 q -30 18 -60 0 q -30 18 -60 0 q -30 18 -60 0 q -30 18 -60 0 q -30 18 -60 0 q -30 18 -60 0 q -30 18 -60 0 Z" fill="url(#folds)"/>
    <path d="M0 0 H1200 V24 q -30 18 -60 0 q -30 18 -60 0 q -30 18 -60 0 q -30 18 -60 0 q -30 18 -60 0 q -30 18 -60 0 q -30 18 -60 0 q -30 18 -60 0 q -30 18 -60 0 q -30 18 -60 0 q -30 18 -60 0 q -30 18 -60 0 q -30 18 -60 0 q -30 18 -60 0 q -30 18 -60 0 q -30 18 -60 0 q -30 18 -60 0 q -30 18 -60 0 q -30 18 -60 0 q -30 18 -60 0 Z" fill="#000" fill-opacity=".25"/>
    <path d="M1200 24 q -30 18 -60 0 q -30 18 -60 0 q -30 18 -60 0 q -30 18 -60 0 q -30 18 -60 0 q -30 18 -60 0 q -30 18 -60 0 q -30 18 -60 0 q -30 18 -60 0 q -30 18 -60 0 q -30 18 -60 0 q -30 18 -60 0 q -30 18 -60 0 q -30 18 -60 0 q -30 18 -60 0 q -30 18 -60 0 q -30 18 -60 0 q -30 18 -60 0 q -30 18 -60 0 q -30 18 -60 0" stroke="url(#gold)" stroke-width="3" fill="none"/>
  </g>
</svg>
